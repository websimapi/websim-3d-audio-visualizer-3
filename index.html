<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trippy Tunnel Experience</title>
    <style>
        * { margin: 0; padding: 0; }
        canvas { 
            display: block;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <script type="module">
        import { setupWebGL, getShader } from '/webgl-utils.js';

        let mouseX = 0.5, mouseY = 0.5;
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX / window.innerWidth;
            mouseY = e.clientY / window.innerHeight;
        });

        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');
        
        const program = await setupWebGL(gl, {
            vertexURL: './assets/trippy-tunnel.glsl',
            fragmentURL: './assets/trippy-tunnel.glsl',
            attribs: { a_position: 0 },
            stride: 0
        });

        const vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        gl.useProgram(program);
        const uTime = gl.getUniformLocation(program, 'u_time');
        const uMouse = gl.getUniformLocation(program, 'u_mouse');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        function animate(time) {
            time *= 0.001; // Convert to seconds
            
            gl.uniform1f(uTime, time);
            gl.uniform2f(uMouse, mouseX, mouseY);
            
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(animate);
        }
        
        animate(0);
    </script>
